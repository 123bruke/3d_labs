<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Guided chemistry experiment workflow</title>
  <desc id="desc">A branded preview illustration of the experiment timeline and measurement panel.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1716"/><stop offset="1" stop-color="#1b2926"/></linearGradient></defs>
  <rect width="1400" height="820" fill="url(#bg)"/><rect x="48" y="42" width="1304" height="70" rx="16" fill="#142522" stroke="#3d6d63"/><text x="80" y="86" fill="#b9f6e5" font-family="Arial" font-size="25" font-weight="700">MASS AND VOLUME MEASUREMENT</text><text x="1110" y="84" fill="#83dfc2" font-family="Arial" font-size="16">STEP 3 OF 5</text>
  <rect x="68" y="148" width="820" height="590" rx="22" fill="#10201e" stroke="#2e5049"/><text x="105" y="198" fill="#d8fff4" font-family="Arial" font-size="24" font-weight="700">Experiment timeline</text><text x="105" y="230" fill="#91b8ae" font-family="Arial" font-size="16">Dispense water into the tared beaker</text>
  <g font-family="Arial"><circle cx="132" cy="300" r="23" fill="#55d6b5"/><text x="125" y="308" fill="#09201a" font-size="18" font-weight="700">✓</text><path d="M132 323v76" stroke="#55d6b5" stroke-width="4"/><text x="180" y="294" fill="#c6efe3" font-size="19" font-weight="700">Workstation setup</text><text x="180" y="322" fill="#87aaa1" font-size="15">Equipment placed and validated</text>
  <circle cx="132" cy="440" r="23" fill="#55d6b5"/><text x="125" y="448" fill="#09201a" font-size="18" font-weight="700">✓</text><path d="M132 463v76" stroke="#55d6b5" stroke-width="4"/><text x="180" y="434" fill="#c6efe3" font-size="19" font-weight="700">Tare container mass</text><text x="180" y="462" fill="#87aaa1" font-size="15">Balance reset to 0.00 g</text>
  <circle cx="132" cy="580" r="23" fill="#d5a85b"/><text x="125" y="588" fill="#21180a" font-size="18" font-weight="700">3</text><text x="180" y="574" fill="#f5ddb0" font-size="19" font-weight="700">Dispense water into beaker</text><text x="180" y="602" fill="#b99b68" font-size="15">Add 60 mL of purified water</text>
  <rect x="180" y="640" width="310" height="48" rx="12" fill="#55d6b5"/><text x="268" y="670" fill="#08221b" font-size="16" font-weight="700">CONTINUE EXPERIMENT</text></g>
  <rect x="932" y="148" width="400" height="590" rx="22" fill="#132522" stroke="#3d6d63"/><text x="970" y="198" fill="#d8fff4" font-family="Arial" font-size="23" font-weight="700">Live measurement</text><rect x="970" y="240" width="324" height="112" rx="15" fill="#081412" stroke="#527c70"/><text x="995" y="275" fill="#7fa79c" font-family="Arial" font-size="14">BALANCE READING</text><text x="995" y="326" fill="#91f2d4" font-family="monospace" font-size="34">60.00 g</text><rect x="970" y="385" width="324" height="112" rx="15" fill="#081412" stroke="#527c70"/><text x="995" y="420" fill="#7fa79c" font-family="Arial" font-size="14">VOLUME</text><text x="995" y="471" fill="#91f2d4" font-family="monospace" font-size="34">60.0 mL</text><rect x="970" y="540" width="324" height="110" rx="15" fill="#1a3933"/><text x="995" y="576" fill="#9dc8bc" font-family="Arial" font-size="14">STATUS</text><circle cx="1004" cy="613" r="8" fill="#55d6b5"/><text x="1024" y="620" fill="#c6efe3" font-family="Arial" font-size="18">Balance stable</text></svg>
