<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Density of liquids results</title>
  <desc id="desc">A branded preview illustration of density measurements and comparison results.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1716"/><stop offset="1" stop-color="#172b27"/></linearGradient></defs>
  <rect width="1400" height="820" fill="url(#bg)"/><rect x="55" y="42" width="1290" height="72" rx="17" fill="#142522" stroke="#3d6d63"/><text x="90" y="87" fill="#b9f6e5" font-family="Arial" font-size="25" font-weight="700">DENSITY OF LIQUIDS</text><text x="1090" y="85" fill="#91b8ae" font-family="Arial" font-size="16">RESULTS &amp; OBSERVATIONS</text>
